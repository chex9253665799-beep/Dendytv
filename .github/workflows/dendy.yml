name: Dendy TV APK

# Сборка приложения для Android TV. Запуск: Actions → Dendy TV APK → Run workflow (или любой push в master).
# Нужен секрет DENDY_KEY_PASS — пароль ключа подписи (ключ лежит зашифрованным в signing/dendy.jks.gpg).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md", "fastlane/**"]

concurrency: dendy

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Ключ подписи
        env:
          P: ${{ secrets.DENDY_KEY_PASS }}
        run: |
          [ -n "$P" ] || { echo "Нет секрета DENDY_KEY_PASS"; exit 1; }
          gpg --batch --quiet --passphrase "$P" -d signing/dendy.jks.gpg > release.jks
      - name: Бесплатные игры (открытые лицензии, собираются из исходников)
        run: |
          set +e
          G=lemuroid-app/src/main/assets/games; mkdir -p $G
          sudo apt-get install -y -qq cc65 python3-pil >/dev/null
          mkdir -p /tmp/g && cd /tmp/g
          # Thwaite и Concentration Room — Damian Yerrick (pinobatch), GPL-3
          for r in thwaite-nes croom-nes; do
            git clone -q --depth 1 https://github.com/pinobatch/$r && (cd $r && make -s >/dev/null 2>&1; ls *.nes)
          done
          [ -f thwaite-nes/thwaite.nes ] && cp thwaite-nes/thwaite.nes "$GITHUB_WORKSPACE/$G/Thwaite.nes"
          [ -f croom-nes/croom.nes ] && cp croom-nes/croom.nes "$GITHUB_WORKSPACE/$G/Concentration Room.nes"
          # Alex vs Bus (Sega) — M374LX, GPL-3 / CC BY-SA 4.0
          curl -fsSL http://sun.hasenbraten.de/vasm/release/vasm.tar.gz | tar xz && (cd vasm && make -s CPU=m68k SYNTAX=mot >/dev/null 2>&1)
          git clone -q --depth 1 https://github.com/M374LX/alexvsbus-md && (cd alexvsbus-md && PATH=/tmp/g/vasm:$PATH sh build.sh)
          [ -f alexvsbus-md/alexvsbus.md ] && cp alexvsbus-md/alexvsbus.md "$GITHUB_WORKSPACE/$G/Alex vs Bus.md"
          cat > "$GITHUB_WORKSPACE/$G/LICENSES.txt" <<'TXT'
          Бесплатные игры в Dendy TV (свободные лицензии, исходники открыты):
          Thwaite — Damian Yerrick, GPL-3.0 — https://github.com/pinobatch/thwaite-nes
          Concentration Room — Damian Yerrick, GPL-3.0 — https://github.com/pinobatch/croom-nes
          Alex vs Bus: The Race — M374LX, GPL-3.0 (код), CC BY-SA 4.0 (графика, музыка) — https://github.com/M374LX/alexvsbus-md
          TXT
          ls -la "$GITHUB_WORKSPACE/$G"
          exit 0
      - name: Сборка
        env:
          DENDY_KEY_PASS: ${{ secrets.DENDY_KEY_PASS }}
          DENDY_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFreeDynamicRelease
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk dendytv.apk
          ls -la dendytv.apk
      - name: Выпуск dendy-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dendy-latest -y --cleanup-tag 2>/dev/null || true
          gh release create dendy-latest dendytv.apk -t "Dendy TV (сборка ${{ github.run_number }})" -n "Скачать: dendytv.apk" --latest
